<!DOCTYPE html>
<html>
<head>
    <title>STALKER LAST ROAD - ИНТЕРАКТИВНАЯ КАРТА</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com" />
    <script src="https://unpkg.com"></script>
    <style>
        html, body { height: 100%; margin: 0; padding: 0; background: #1a1a1a; font-family: Arial, sans-serif; }
        #header { height: 50px; background: #2b2b2b; color: #fff; line-height: 50px; padding-left: 20px; font-size: 20px; font-weight: bold; }
        #map { height: calc(100% - 50px); width: 100%; }
        .leaflet-popup-content-wrapper { background: #222; color: #fff; border: 1px solid #555; }
        .leaflet-popup-tip { background: #222; }
    </style>
</head>
<body>

    <div id="header">STALKER LAST ROAD - ИНТЕРАКТИВНАЯ КАРТА</div>
    <div id="map"></div>

    <script type="text/javascript">
        // Инициализируем карту в простых пикселях
        var map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: 0,
            maxZoom: 6
        });

        // Настройки сетки на основе вашей генерации
        var maxZoom = 6;
        
        // Кастомная функция расчета путей, которая ИДЕАЛЬНО подстраивается под gdal2tiles
        var baseMap = L.tileLayer('./{z}/{x}/{y}.png', {
            noWrap: true,
            continuousWorld: true,
            tileSize: 256,
            // Математический переворот Y, чтобы Leaflet читал папки точь-в-точь как их создала программа
            tileUrlFunction: function(coords) {
                var z = coords.z;
                var x = coords.x;
                // Формула инверсии Y для плоского растра gdal2tiles
                var y = Math.pow(2, z) - 1 - coords.y; 
                return './' + z + '/' + x + '/' + y + '.png';
            }
        });

        // Подменяем стандартный метод Leaflet на наш рабочий расчет путей
        baseMap.getTileUrl = baseMap.options.tileUrlFunction;
        baseMap.addTo(map);

        // Устанавливаем камеру в стартовую рабочую точку (координаты пикселей)
        map.setView([-100, 100], 1);

        // Слои для галочек
        var layerBazy = L.layerGroup().addTo(map);
        var layerAnomalii = L.layerGroup().addTo(map);

        // Примеры меток
        L.marker([-100, 100]).addTo(layerBazy).bindPopup('<b>Стартовая точка Зоны</b>');

        var overlayMaps = {
            "<span style='color: #55ff55; font-weight:bold;'>🏰 Базы</span>": layerBazy,
            "<span style='color: #ff5555; font-weight:bold;'>☢️ Аномалии</span>": layerAnomalii
        };
        L.control.layers(null, overlayMaps, {collapsed: false}).addTo(map);

        // Клик-утилита для поиска координат
        map.on('click', function(e) {
            L.popup()
                .setLatLng(e.latlng)
                .setContent("Сюда в Блокнот:<br><b>[" + e.latlng.lat.toFixed(0) + ", " + e.latlng.lng.toFixed(0) + "]</b>")
                .openOn(map);
        });
    </script>
</body>
</html>
